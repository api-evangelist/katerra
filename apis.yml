aid: katerra
name: Katerra
description: >-
  Katerra was a Menlo Park, California off-site construction and building-technology company
  founded in 2015 by former Flextronics chief executive Michael Marks with Fritz Wolff and Jim
  Davidson, built on the thesis that a single vertically integrated firm could design, engineer,
  manufacture and assemble buildings end to end — running its own architecture practice, factories
  in Phoenix, Tracy and Spokane producing cross-laminated timber and prefabricated wall, floor and
  bathroom assemblies, and its own supply chain and general contracting arm. It raised more than
  $2 billion across a dozen rounds, including an $865M Series D led by the SoftBank Vision Fund in
  January 2018 at a valuation above $3 billion and a $200M recapitalization in December 2020 that
  handed SoftBank majority control. Its only software product was Katerra Apollo, announced in
  February 2019 as a design-to-field platform (Apollo Construct, Apollo Insight, Apollo Connect)
  whose launch materials promised "open API integration" with existing construction workflows —
  but Apollo was sold to Katerra's own construction customers and never shipped a public developer
  portal, API reference, SDK or machine-readable specification. The insolvency of its SoftBank-backed
  lender Greensill Capital cost Katerra its bonding capacity, and the company shut down and filed
  Chapter 11 in the Southern District of Texas on 6 June 2021. Its assets were broken up: the Apollo
  software went to Builders FirstSource for roughly $4.5M on 9 September 2021, and the factories were
  sold separately. katerra.com no longer serves a site — it answers a Cloudflare error 1001 on every
  path and cannot complete a TLS handshake at all. This profile is retained as a historical record;
  there is no API surface left to catalog.
