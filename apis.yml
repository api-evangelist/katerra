x-successor-note: >-
  The Katerra Apollo software assets were acquired by Builders FirstSource (NYSE: BLDR) for
  approximately $4.5M on 9 September 2021 and folded into that company's digital tools alongside
  WTS Paradigm. Apollo is not published by Builders FirstSource as a public API either, and any
  contract on a bldr.com host would belong to Builders FirstSource, not to Katerra, so nothing is
  wired here from the acquirer.
x-domain-status: dead
x-domain-note: >-
  katerra.com still resolves (Route 53 nameservers, Cloudflare edge addresses) but serves no origin:
  http:// returns HTTP 409 with Cloudflare "error code: 1001" on every path including all
  /.well-known/* and spec paths, and https:// fails the TLS handshake outright. Wayback captures show
  this same 409 error page continuously from April 2022 onward. api., docs., developer., apollo. and
  app.katerra.com do not resolve at all. It is dead, not parked, and is deliberately not wired as a
  Website pointer. See well-known/katerra-well-known.yml.
x-github-note: >-
  Three GitHub organizations carry the name (github.com/Katerra, github.com/katerrainc — whose profile
  blog is katerra.com — and github.com/Katerra-inc). All three have zero public repositories, so no
  GitHubOrganization pointer is wired: the org shells exist but publish nothing.
